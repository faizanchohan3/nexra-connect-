# Shopify app configuration. Upload it with:
#   npx @shopify/cli@latest app deploy
# Replace nexra-connect.nexrallc.workers.dev with the worker address printed by `npm run deploy`
# (for example nexra-connect.yourname.workers.dev). The Client ID is already set.

client_id = "b9721439ab32d5045b1a8cdc4b5984f3"
name = "Nexra Connect"
application_url = "https://nexra-connect.nexrallc.workers.dev/install"
embedded = false

[access_scopes]
# The app asks each store for its own scopes during install (see src/shopify.js);
# this list is the union so Shopify's review sees everything the app can request.
scopes = "read_customers,read_orders,read_products,write_draft_orders,write_products"
use_legacy_install_flow = true

[auth]
redirect_urls = ["https://nexra-connect.nexrallc.workers.dev/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://nexra-connect.nexrallc.workers.dev/webhooks/shopify"

[app_proxy]
url = "https://nexra-connect.nexrallc.workers.dev/proxy"
prefix = "apps"
subpath = "nexra"

[pos]
embedded = false
