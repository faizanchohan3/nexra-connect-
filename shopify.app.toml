# Nexra store app: installed only on the Nexra store (Distribution: Custom, h0vzt0-80.myshopify.com).
# Runs the nexrallc.com/apps/nexra app proxy and reads the catalog. Upload with:
#   npx @shopify/cli@latest app deploy

client_id = "b9721439ab32d5045b1a8cdc4b5984f3"
name = "Nexra Connect"
application_url = "https://nexra-connect.nexrallc.workers.dev/install"
embedded = false

[access_scopes]
scopes = "read_customers,read_orders,read_products,write_draft_orders"
use_legacy_install_flow = true

[auth]
redirect_urls = ["https://nexra-connect.nexrallc.workers.dev/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://nexra-connect.nexrallc.workers.dev/webhooks/shopify"

[app_proxy]
url = "https://nexra-connect.nexrallc.workers.dev/proxy"
prefix = "apps"
subpath = "nexra"

[pos]
embedded = false
